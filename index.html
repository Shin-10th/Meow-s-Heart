<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meow's Heart - Premium Beauty Products from Asia</title>
    <meta name="description" content="Trendy, authentic, and affordable beauty solutions from Korea, Thailand, and China. Discover your purr-fect beauty look with Meow's Heart." />
    <!--
      Applies the visitor's saved color theme before the stylesheet
      paints, so there's no flash of the default palette. Keep this in
      sync with src/themes.ts if you add/change a theme. (The cursor
      and cat companion don't need anything here — they're plain React
      components styled with these same CSS variables.)
    -->
    <script>
      (function () {
        try {
          var THEMES = {
            classic: {"--color-brand-50":"#fef8fa","--color-brand-100":"#fdf0f5","--color-brand-200":"#fadce8","--color-brand-300":"#f6bfd3","--color-brand-400":"#f19fb9","--color-brand-500":"#ea7ea4","--color-brand-600":"#de4f81","--color-brand-700":"#c72960","--color-brand-800":"#9b224c","--color-brand-900":"#781c3c","--color-cream":"#fef8fa","--color-cream-dark":"#fceef4","--color-cocoa":"#5b3a29","--color-cocoa-light":"#8a6a55","--color-gold":"#ea7ea4","--color-gold-light":"#fadce8"},
            pixelmeow: {"--color-brand-50":"#fdf4f3","--color-brand-100":"#fbe7e5","--color-brand-200":"#f4cdc9","--color-brand-300":"#e9aaa5","--color-brand-400":"#db8781","--color-brand-500":"#c76d68","--color-brand-600":"#ad5450","--color-brand-700":"#8c4441","--color-brand-800":"#703937","--color-brand-900":"#5c302f","--color-cream":"#fdf9f6","--color-cream-dark":"#f6ece5","--color-cocoa":"#453a36","--color-cocoa-light":"#8c7c74","--color-gold":"#c6a15b","--color-gold-light":"#e8dcc0"},
            lavender: {"--color-brand-50":"#f6f2fb","--color-brand-100":"#ede4f7","--color-brand-200":"#d9c5ef","--color-brand-300":"#c1a1e3","--color-brand-400":"#a97ed4","--color-brand-500":"#8f5fc2","--color-brand-600":"#7548a3","--color-brand-700":"#5e3a84","--color-brand-800":"#4a2f68","--color-brand-900":"#3c2653","--color-cream":"#faf8fd","--color-cream-dark":"#f1ecf9","--color-cocoa":"#40353f","--color-cocoa-light":"#8a7a87","--color-gold":"#b9925e","--color-gold-light":"#e6d6bd"},
            sage: {"--color-brand-50":"#f3f7f1","--color-brand-100":"#e3ece0","--color-brand-200":"#c6d9bf","--color-brand-300":"#a3c197","--color-brand-400":"#7fa76e","--color-brand-500":"#628c53","--color-brand-600":"#4e7142","--color-brand-700":"#405b37","--color-brand-800":"#34492d","--color-brand-900":"#2b3c25","--color-cream":"#f9faf6","--color-cream-dark":"#eef2e8","--color-cocoa":"#3c3a33","--color-cocoa-light":"#857f6f","--color-gold":"#c2a15c","--color-gold-light":"#ecdfbf"}
          };
          var saved = localStorage.getItem('meows-heart-theme');
          var vars = THEMES[saved] || THEMES.classic;
          var root = document.documentElement;
          for (var k in vars) { root.style.setProperty(k, vars[k]); }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
